<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Redirecting — REHAAN_ENGINE</title>
  <script>
    // Redirect all paths to root for GitHub Pages SPA compatibility
    const path = window.location.pathname;
    const repo = '/My_Portfolio.web';
    if (path.startsWith(repo)) {
      window.location.replace(repo + '/');
    } else {
      window.location.replace('/');
    }
  </script>
</head>
<body style="background:#030a21;color:#00f2fe;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;">
  <p>Redirecting to REHAAN_ENGINE Spatial Universe...</p>
</body>
</html>
